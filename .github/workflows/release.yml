name: Release

# Tag a version, get an app. `git tag v0.1.0 && git push --tags` builds,
# packages and attaches a DMG to a GitHub Release, so nobody has to install a
# Swift toolchain to try a menu bar utility.
#
# SIGNING, AND WHY IT MATTERS MORE HERE THAN USUALLY
#
# This app needs the microphone, and macOS keys that permission to the app's
# code signature. An ad-hoc signature changes on every build, so an ad-hoc
# release is a different app to TCC every time — the permission does not carry
# over and the prompt returns. It also will not pass Gatekeeper on a download.
#
# So the workflow signs properly when the secrets are present and degrades
# loudly when they are not. Set these to get a distributable build:
#
#   MACOS_CERT_P12        base64 of a Developer ID Application .p12
#   MACOS_CERT_PASSWORD   the password for that .p12
#   MACOS_SIGN_IDENTITY   e.g. "Developer ID Application: Artisan Build, Inc (83AD4SGJLW)"
#
# And these to notarize, so Gatekeeper opens it without a right-click:
#
#   NOTARY_KEY_P8         base64 of an App Store Connect .p8 private key
#   NOTARY_KEY_ID         that key's ID
#   NOTARY_ISSUER_ID      the issuer UUID
#
# Produce the first one with:
#   security find-identity -v -p codesigning          # confirm the identity
#   # export it from Keychain Access as Certificates.p12, then:
#   base64 -i Certificates.p12 | pbcopy
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to build, e.g. v0.1.0'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Version
        id: v
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Show toolchain
        run: swift --version

      - name: Test
        run: swift test --package-path app

      # Which optional secrets exist, as step outputs. `if:` cannot read a
      # step's own `env:`, so gating directly on a secret there produces a
      # workflow GitHub refuses to parse — this is the pattern that works.
      - name: Check for signing secrets
        id: have
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}
          NOTARY: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          if [ -n "$CERT" ]; then echo "cert=true" >> "$GITHUB_OUTPUT"; else echo "cert=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$NOTARY" ]; then echo "notary=true" >> "$GITHUB_OUTPUT"; else echo "notary=false" >> "$GITHUB_OUTPUT"; fi

      # Import the Developer ID into a throwaway keychain. Skipped without
      # secrets, in which case bundle.sh falls back to an ad-hoc signature.
      - name: Import signing certificate
        id: signing
        if: steps.have.outputs.cert == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASSPHRASE="$(uuidgen)"
          security create-keychain -p "$PASSPHRASE" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$PASSPHRASE" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$PASSPHRASE" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build and bundle
        env:
          SIGN_ID: ${{ secrets.MACOS_SIGN_IDENTITY || '-' }}
        run: ./app/Scripts/bundle.sh

      - name: Warn if unsigned
        if: steps.have.outputs.cert != 'true'
        run: |
          echo "::warning title=Ad-hoc signature::No MACOS_CERT_P12 secret, so this build is ad-hoc signed. It will not pass Gatekeeper, and macOS will treat every rebuild as a different app for microphone permission."

      - name: Notarize
        if: steps.have.outputs.cert == 'true' && steps.have.outputs.notary == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/key.p8"
          ditto -c -k --keepParent dist/Sonocles.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/key.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait
          # Staple, so the app opens offline without a Gatekeeper round trip.
          xcrun stapler staple dist/Sonocles.app
          rm -f "$RUNNER_TEMP/key.p8"

      # Asset names carry no version, on purpose. GitHub's
      # /releases/latest/download/<name> redirect only resolves when the name is
      # stable, and a download link on the site that has to be edited for every
      # release is a link that will eventually point at something old. The
      # release itself carries the version.
      - name: Package
        run: |
          mkdir -p dist/dmg
          cp -R dist/Sonocles.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Sonocles" -srcfolder dist/dmg \
            -ov -format UDZO dist/Sonocles.dmg
          ditto -c -k --keepParent dist/Sonocles.app dist/Sonocles.zip
          shasum -a 256 dist/Sonocles.dmg dist/Sonocles.zip > dist/checksums.txt
          cat dist/checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Sonocles-${{ steps.v.outputs.tag }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/checksums.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        # Notes are built line by line into a file. A heredoc or a multi-line
        # shell string here is a trap: a blank line at column zero closes the
        # YAML block scalar, and the workflow becomes unparseable in a way that
        # reports only as "run failed" with no logs.
        run: |
          VER="${{ steps.v.outputs.tag }}"
          {
            echo "Apple Silicon, macOS 14 or later. Models download on first run (~219 MB)."
            echo ""
            echo "Always-current download:"
            echo "https://github.com/artisan-build/sonocles/releases/latest/download/Sonocles.dmg"
            if [ "${{ steps.have.outputs.cert }}" != "true" ]; then
              echo ""
              echo "**This build is ad-hoc signed.** macOS will refuse to open it normally — right-click the app and choose Open, and expect the microphone prompt again after every update."
            fi
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$VER" \
            --title "Sonocles $VER" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/*.dmg dist/*.zip dist/checksums.txt
