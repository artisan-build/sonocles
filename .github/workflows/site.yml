name: site

# Build the site on a pull request, so a broken page is caught before it is
# on main and about to deploy. This never deploys: no secrets, no Wrangler.
# deploy-site.yml is the only thing that talks to Cloudflare, and it runs on
# pushes to main alone.
on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
