name: tests

# docs/openapi.yaml is in the paths because the contract test reads it: a
# change to the spec alone must run the suite, or the reference the site
# generates from it could say something the daemon does not do.
#
# php/** is there for the changelog job only: a PR that changes the NativePHP
# app has changed something a user sees, and needs its line in CHANGELOG.md
# like any other.
on:
  push:
    branches: [main]
    paths: ['app/**', 'docs/openapi.yaml', '.github/workflows/tests.yml']
  pull_request:
    paths: ['app/**', 'php/**', 'docs/openapi.yaml', '.github/workflows/tests.yml']

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macos-26 for the SDK, not the OS floor. The package targets macOS 14,
    # but the Apple baseline engine needs macOS 26 declarations to compile at
    # all — on an older runner it is conditionally compiled out and never
    # gets checked.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Show toolchain
        run: swift --version

      # Only the pure targets run here. Anything touching capture needs a
      # microphone and a TCC grant, neither of which exists on a runner — and a
      # test that silently passes because it heard nothing would be worse than
      # no test at all.
      - name: Test
        run: swift test --package-path app

      - name: Lint
        run: xcrun swift-format lint --recursive app/Sources app/Tests

  # A PR that changes what a user sees carries its CHANGELOG.md line, or says
  # why it has none. The compared range is the PR's own commits against the
  # base branch, so a merge from main does not count as touching anything.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: CHANGELOG.md moved with the code
        if: "!contains(github.event.pull_request.labels.*.name, 'skip-changelog')"
        env:
          BASE: ${{ github.base_ref }}
        run: |
          CHANGED="$(git diff --name-only "origin/$BASE...HEAD")"
          AREAS="$(echo "$CHANGED" | { grep -E '^(app/|php/|docs/openapi\.yaml$)' || true; } | sed -E 's#^(app/|php/).*#\1#' | sort -u | paste -sd ' ' -)"
          if [ -n "$AREAS" ] && ! echo "$CHANGED" | grep -qx 'CHANGELOG.md'; then
            echo "::error title=No changelog entry::This PR changes $AREAS but not CHANGELOG.md — add a line under ## [Unreleased], or label the PR skip-changelog"
            exit 1
          fi
          echo "changed: ${AREAS:-nothing user-facing}"
