<!doctype html>
<!--
  The Free · Open source pill for the generated docs cards, as og.html wears
  it. astro-og-canvas has one logo slot (the strip) and no second text block,
  but it composes a background image over the ground before the logo and the
  title — so the pill rides in as a transparent 1200×630 layer with nothing
  on it but the pill, top right, level with the strip. The numbers mirror the
  route's layout: padding 72, the strip 44 tall at the top-left margin.

      cd site && node art/og.mjs og-pill.html src/assets/og-pill.png --transparent
-->
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@600&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; }
  body { width:1200px; height:630px; background:transparent; overflow:hidden; position:relative; font-family:'Instrument Sans',system-ui,sans-serif; }
  .pill { position:absolute; top:78px; right:72px; background:#B2461F; color:#fff; font-size:14px; font-weight:600;
    letter-spacing:.08em; text-transform:uppercase; padding:7px 16px; border-radius:999px; line-height:1.2; }
</style></head>
<body><span class="pill">Free · Open source</span></body></html>
