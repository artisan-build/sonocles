<!doctype html>
<!--
  Source for public/img/og.png — the social card, composed rather than
  cropped. Not part of the Astro build; render it when the card changes:

      cd site && node art/og.mjs og.html public/img/og.png

  The composition is rheocles.com's, in this palette (Len, 13 Sep 2026,
  "v3"): the colonnade band across the top, brand row, the two-line
  headline with "still saying them." in terracotta, the what-it-is line and
  the streaming line, the muted platform line; the pill in the bottom-left
  corner; the real popover on the right — the app's own --render-preview,
  its "listening" state (a live line, the engine picker) — bleeding off the
  right and the bottom with the transcript and picker whole; the philosopher
  and the scribe as a sticker (art/sticker.py → src/assets/plates/hero.png) in
  the left column below the copy, 460px wide, his feet just off the bottom,
  the sound arcs reaching the popover's edge. Text never overlays the art.

  To re-shoot the popover (never launch the built app itself; the live one
  holds 7357/7358):

      cd app && swift build -c release --product Sonocles
      .build/release/Sonocles --render-preview /tmp/sonocles-previews
      cp /tmp/sonocles-previews/listening.png ../site/src/assets/popover.png

  Nothing is set below 18px: a card is read at about 500px wide in a chat
  timeline.
-->
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,500;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --stone:#FAF2E4; --stone-deep:#EFE5D2; --stone-sink:#E0D4BE;
    --ink:#2A211A; --ink-soft:#4E4034; --script:#7A6A59;
    --terracotta:#C4552E; --terracotta-deep:#B2461F;
  }
  * { box-sizing:border-box; margin:0; }
  body { width:1200px; height:630px; background:var(--stone); overflow:hidden;
    font-family:'Instrument Sans',system-ui,sans-serif; position:relative; }
  /* The colonnade every page wears at its head: fluting over the terracotta floor. */
  .colonnade { position:absolute; top:0; left:0; right:0; height:34px; z-index:4; }
  .colonnade::before { content:''; position:absolute; inset:0 0 6px 0;
    background:repeating-linear-gradient(90deg, var(--stone-deep) 0 5px, var(--stone-sink) 5px 6px, var(--stone-deep) 6px 11px, transparent 11px 30px); }
  .colonnade::after { content:''; position:absolute; left:0; right:0; bottom:0; height:6px; background:var(--terracotta); opacity:.85; }
  .pad { padding:66px 58px 44px 58px; height:100%; display:flex; flex-direction:column; position:relative; z-index:3; }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand .name { font-family:'Fraunces',serif; font-weight:700; font-size:30px; color:var(--ink);
    font-variation-settings:'SOFT' 40,'WONK' 1; }
  .brand .say { font-family:'IBM Plex Mono',monospace; font-size:15px; color:var(--script); }
  h1 { font-family:'Fraunces',serif; font-weight:600; font-size:58px; line-height:1.06; margin-top:44px;
    color:var(--ink); letter-spacing:-.022em; font-variation-settings:'SOFT' 30,'WONK' 1; white-space:nowrap; }
  h1 em { font-style:normal; color:var(--terracotta); }
  .foot { margin-top:30px; }
  .cat { font-size:26px; font-weight:600; color:var(--ink); letter-spacing:-.012em; line-height:1.2; }
  .meta { color:var(--ink-soft); font-size:21px; margin-top:8px; }
  .meta b { font-weight:600; color:var(--ink); }
  .foot .meta.platform { font-size:18px; color:var(--ink); opacity:.6; margin-top:20px; }
  .pill { position:absolute; left:58px; bottom:36px; margin:0; background:var(--terracotta-deep); color:#fff; font-size:14px; font-weight:600;
    letter-spacing:.08em; text-transform:uppercase; padding:7px 16px; border-radius:999px; line-height:1.2; }
  /* The popover (--render-preview, the listening state: a live line, the
     engine picker), bleeding off the right and the bottom. */
  .popover { position:absolute; left:715px; top:166px; width:500px; z-index:1; display:block; border-radius:12px;
    box-shadow:0 2px 4px rgba(42,33,26,.14), 0 18px 48px -12px rgba(42,33,26,.35); }
  /* The philosopher and the scribe in front, over the popover's lower-left,
     with a halo of the ground so the transcript does not read through the
     gaps between them. */
  .art { position:absolute; left:300px; bottom:-48px; width:460px; z-index:2; display:block; }
</style></head>
<body>
  <div class="colonnade"></div>
  <img class="popover" src="src/assets/popover.png" alt="">
  <img class="art" src="src/assets/plates/hero.png" alt="">
  <div class="pad">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 32 32">
        <circle cx="7" cy="16" r="3" fill="#C4552E"/>
        <path d="M12 9.5a10 10 0 0 1 0 13" stroke="#C4552E" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <path d="M17.5 6.5a16 16 0 0 1 0 19" stroke="#C4552E" stroke-width="2.6" fill="none" stroke-linecap="round" opacity=".72"/>
        <path d="M23 3.5a22 22 0 0 1 0 25" stroke="#C4552E" stroke-width="2.6" fill="none" stroke-linecap="round" opacity=".45"/>
      </svg>
      <span class="name">Sonocles</span>
      <span class="say">so-NOK-leez</span>
    </div>
    <h1>Words, while you're<br><em>still saying them.</em></h1>
    <div class="foot">
      <p class="cat">Live speech-to-text for the Mac.</p>
      <p class="meta">Streamed over WebSocket or SSE, in real time.</p>
      <p class="meta platform">Built for Mac · macOS 14 or later</p>
    </div>
    <span class="pill">Free · Open source · MIT</span>
  </div>
</body></html>
